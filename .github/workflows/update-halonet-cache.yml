name: Update HaloNet map index

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday update. The list changes slowly, and the updater only
    # commits when the exact filename index actually changes.
    - cron: "17 7 * * 1"

permissions:
  contents: write

jobs:
  update-halonet-index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate HaloNet exact filename index
        run: python "Update HaloNet Cache.py"

      - name: Commit updated index
        shell: bash
        run: |
          if git diff --quiet -- halonet_map_index.json; then
            echo "HaloNet index is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add halonet_map_index.json
          git commit -m "Update HaloNet map index"
          git push
